name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a new push cancels an in-flight one instead of queuing.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Must match the repo name — GitHub Pages serves a project site at
  # https://<user>.github.io/<repo>/, so the Blazor WASM app needs its <base href>
  # rewritten to that subpath (it defaults to "/", which only works on a user/org site).
  BASE_PATH: /JadwalSholat/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test --no-restore --configuration Release

      - name: Publish
        run: dotnet publish src/JadwalSholat.Web/JadwalSholat.Web.csproj -c Release -o release --no-restore

      - name: Rewrite base href for the GitHub Pages subpath
        run: sed -i "s|<base href=\"/\" />|<base href=\"${BASE_PATH}\" />|" release/wwwroot/index.html

      - name: Add SPA fallback and disable Jekyll processing
        run: |
          cp release/wwwroot/index.html release/wwwroot/404.html
          touch release/wwwroot/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
